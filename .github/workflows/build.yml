name: Build GreyDM
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Test keystore
        run: |
          if [ ! -f test.keystore ]; then
            keytool -genkeypair -keystore test.keystore -storepass android -keypass android -alias test -keyalg RSA -keysize 2048 -validity 36500 -dname "CN=GreyDM Test, O=Test, C=US"
            git config user.name "github-actions"
            git config user.email "actions@github.com"
            git add test.keystore
            git commit -m "Add test keystore [skip ci]"
            git push || echo "Could not push the keystore. Check workflow permissions."
          fi
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Generate project
        run: |
          mkdir -p proj/app/src/main/java/com/grey/dm proj/app/src/main/res/xml proj/app/src/main/res/drawable
          cd proj
          cat > settings.gradle.kts <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "GreyDM"
          include(":app")
          EOF
          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.1.0" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.1.0" apply false
          }
          EOF
          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          org.gradle.jvmargs=-Xmx3g
          EOF
          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }
          android {
              namespace = "com.grey.dm"
              compileSdk = 35
              defaultConfig {
                  applicationId = "com.grey.dm"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
                  ndk { abiFilters += listOf("arm64-v8a") }
              }
              signingConfigs {
                  create("test") {
                      storeFile = rootProject.file("../test.keystore")
                      storePassword = "android"
                      keyAlias = "test"
                      keyPassword = "android"
                  }
              }
              buildTypes {
                  release { signingConfig = signingConfigs.getByName("test") }
                  debug { signingConfig = signingConfigs.getByName("test") }
              }
              lint {
                  checkReleaseBuilds = false
                  abortOnError = false
              }
              buildFeatures { compose = true }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
              packaging { jniLibs { useLegacyPackaging = true } }
          }
          dependencies {
              implementation(platform("androidx.compose:compose-bom:2024.12.01"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.foundation:foundation")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
              implementation("androidx.activity:activity-compose:1.9.3")
              implementation("androidx.core:core-ktx:1.15.0")
              implementation("com.squareup.okhttp3:okhttp:4.12.0")
              implementation("io.github.junkfood02.youtubedl-android:library:0.18.1")
              implementation("io.github.junkfood02.youtubedl-android:ffmpeg:0.18.1")
          }
          EOF
          cat > app/src/main/res/xml/file_paths.xml <<'EOF'
          <paths><external-path name="all" path="."/></paths>
          EOF
          cat > app/src/main/res/drawable/ic.xml <<'EOF'
